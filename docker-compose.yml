version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: origin_defender
      POSTGRES_USER: origin_defender
      POSTGRES_PASSWORD: password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U origin_defender"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s

  similarity-api:
    build:
      context: ./similarity-api
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql://origin_defender:password@postgres:5432/origin_defender
      REDIS_URL: redis://redis:6379
      EMBEDDING_MODEL: sentence-transformers/all-MiniLM-L6-v2
      FAISS_INDEX_PATH: /data/faiss.index
      SOLANA_RPC_URL: ${SOLANA_RPC_URL}
      PORT: 8000
    ports:
      - "8000:8000"
    volumes:
      - similarity_data:/data
      - ./similarity-api:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s

  verification-server:
    build:
      context: ./verification-server
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql://origin_defender:password@postgres:5432/origin_defender
      REDIS_URL: redis://redis:6379
      TWITTER_CLIENT_ID: ${TWITTER_CLIENT_ID}
      TWITTER_CLIENT_SECRET: ${TWITTER_CLIENT_SECRET}
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET}
      JWT_SECRET: ${JWT_SECRET}
      ORIGIN_DEFENDER_PROGRAM_ID: ${ORIGIN_DEFENDER_PROGRAM_ID}
      PORT: 8001
    ports:
      - "8001:8001"
    volumes:
      - ./verification-server:/app
    depends_on:
      - postgres
      - redis

  # Optional: Indexer service
  indexer:
    build:
      context: ./indexer
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql://origin_defender:password@postgres:5432/origin_defender
      SOLANA_RPC_URL: ${SOLANA_RPC_URL}
      PROGRAM_ID: ${ORIGIN_DEFENDER_PROGRAM_ID}
      STARTUP_HEALTH_CHECK: "true"
    volumes:
      - ./indexer:/app
    depends_on:
      postgres:
        condition: service_healthy
    command: ["python", "indexer.py", "--commitment", "confirmed"]

volumes:
  postgres_data:
  redis_data:
  similarity_data:
